#end.on{opacity:1;pointer-events:auto}

#end p{font-size:14px;opacity:.85;margin:6px 0 12px;line-height:1.7}
#end a,#end button{font:700 14px Cairo;color:#e8c468;border:1px solid #e8c468;background:#000a;border-radius:99px;padding:10px 20px;margin:4px;text-decoration:none;display:inline-block;backdrop-filter:blur(6px)}
