<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ثلاثة تطبيقات · يوم أسهل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#2b2b30;--a:#e9d9a8}
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;font-family:Cairo,Tahoma,sans-serif;color:#f4f1ea}
body{display:flex;align-items:center;justify-content:center}
#st{position:relative;height:100dvh;max-width:100vw;aspect-ratio:9/16;overflow:hidden;container-type:size;background:#000}
.bg{position:absolute;inset:-20%;background:radial-gradient(55cqw 45cqh at 50% 58%,var(--g),transparent 70%);transition:background 1.2s;animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(4%,-3%) scale(1.08)}}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;visibility:hidden}
.sc.on{opacity:1;visibility:visible}
.ln{overflow:hidden;padding:.6cqw 0}
.ln>b{display:block;transform:translateY(115%);transition:transform .9s cubic-bezier(.16,1,.3,1);font-weight:900}
.app.on .ln>b,.ln.in>b{transform:none}
.out .pw{opacity:0;transition:opacity .4s}.out .ln>b{transform:translateY(-115%);transition:transform .6s cubic-bezier(.7,0,.84,0)}
.hook{justify-content:center;gap:1.5cqh;text-align:center}
.hook .ln b{font-size:10.5cqw;line-height:1.25}
.hook .last b{color:var(--a)}
.hd{margin-top:8cqh;text-align:center;width:88cqw}
.hd .ln b{font-size:10cqw;line-height:1.25}
.lab{font-size:3.6cqw;letter-spacing:.12em;color:var(--a);opacity:0;transform:translateY(2cqh);transition:all .8s .2s;margin-bottom:1cqh}
.on .lab{opacity:.9;transform:none}
.sb{font-size:4cqw;opacity:0;margin-top:1.2cqh;transition:opacity .8s .5s;color:#d8d3c6}
.on .sb{opacity:1}
.pw{position:relative;margin-top:4cqh;perspective:160cqw}
.dv{position:relative;width:56cqw;aspect-ratio:720/1444;border-radius:7.5cqw;background:#050505;padding:.8cqw;box-shadow:0 0 0 .35cqw #77777c,0 0 0 .75cqw #151517,0 5cqh 9cqh #000,0 0 16cqw var(--g);transform:translateY(60cqh) rotateX(14deg);transition:transform 1.3s cubic-bezier(.16,1,.3,1);will-change:transform}
.on .dv{transform:var(--t,none)}
.dv:before,.dv:after{content:"";position:absolute;width:.7cqw;background:#55555a;border-radius:1cqw}
.dv:before{left:-1.4cqw;top:22%;height:7%;box-shadow:0 11cqw #55555a}
.dv:after{right:-1.4cqw;top:30%;height:12%}
.sr{position:relative;width:100%;height:100%;border-radius:6.8cqw;overflow:hidden;background:#000}
.sr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform-origin:var(--o);transition:opacity .25s}
.sr img.cur{opacity:1;transform:scale(var(--z));transition:opacity .25s,transform 2.6s cubic-bezier(.25,.1,.25,1)}
.hole{position:absolute;top:2.2cqw;left:50%;width:2.6cqw;height:2.6cqw;margin-left:-1.3cqw;border-radius:50%;background:#000;box-shadow:0 0 0 .4cqw #111;z-index:3}
.gl{position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:6.8cqw;background:linear-gradient(115deg,transparent calc(var(--s,40%) - 20%),#ffffff1c var(--s,40%),transparent calc(var(--s,40%) + 20%))}
.wipe{position:absolute;inset:0;background:var(--a);z-index:9;transform:translateX(105%);pointer-events:none}
.fin{justify-content:center;gap:2.4cqh;text-align:center}
.fin .row{width:80cqw;padding:2cqh 0;border-top:1px solid #ffffff22;display:flex;justify-content:space-between;align-items:baseline;opacity:0;transform:translateY(3cqh);transition:all .9s cubic-bezier(.16,1,.3,1)}
.fin .row b{font-size:7.5cqw;font-weight:900}.fin .row span{font-size:3.6cqw;opacity:.6}
.fin .go2{font-size:9cqw;font-weight:900;color:var(--a);margin-top:2cqh;opacity:0;transition:opacity 1s}
.fin .cr{font-size:3.4cqw;opacity:0;transition:opacity 1s;letter-spacing:.04em;color:#bdb8aa}
.fin a{font-size:3.6cqw;color:var(--a);border:1px solid #e9d9a855;border-radius:99px;padding:1.2cqh 5cqw;text-decoration:none;opacity:0;transition:opacity 1s}
.fin.on .row,.fin.on .go2,.fin.on .cr,.fin.on a{opacity:1;transform:none}
.fin.on .row:nth-child(2){transition-delay:.4s}.fin.on .row:nth-child(3){transition-delay:.8s}.fin.on .row:nth-child(4){transition-delay:1.2s}
.fin.on .go2{transition-delay:2s}.fin.on .cr{transition-delay:3s}.fin.on a{transition-delay:3.4s}
.gr{position:absolute;inset:-50%;opacity:.07;pointer-events:none;z-index:8;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:g .5s steps(4) infinite}
@keyframes g{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.vg{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(130% 90% at 50% 50%,transparent 55%,#000b)}
#go{position:absolute;inset:0;z-index:20;background:#000;border:0;color:#f4f1ea;font:900 8cqw Cairo;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqh;cursor:pointer}
#go small{font:400 3.6cqw Cairo;opacity:.55}
@media (prefers-reduced-motion:reduce){.bg,.gr{animation:none}}
</style></head><body><div id="st"><div class="bg" id="bg"></div><div class="vg"></div><div class="gr"></div><div class="wipe" id="wp"></div>
